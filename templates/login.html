<!DOCTYPE html>
<html>
<head>
    <title>ThreatPulse Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            background: #0f172a;
            color: #e5e7eb;
            font-family: Arial, sans-serif;
        }

        .login-box {
            max-width: 400px;
            margin: 100px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #334155;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #f87171;
            margin-bottom: 10px;
        }

        .hint {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 15px;
        }
    </style>
</head>
<body>

<div class="login-box">
    <h2>ThreatPulse Login</h2>
    <p>Real-Time Login Threat Detection Lab</p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">
        <input type="text" name="username" placeholder="Username" autocomplete="off">
        <input type="password" name="password" placeholder="Password">
        <button type="submit">Login</button>
    </form>

    <div class="hint">
        Demo login: <br>
        Username: <b>admin</b><br>
        Password: <b>Admin@123</b>
    </div>
</div>

</body>
</html>
