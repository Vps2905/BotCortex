<!DOCTYPE html>
<html>
<head>
    <title>ThreatPulse SOC Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
        }

        .navbar {
            background: #020617;
            padding: 15px 25px;
            display: flex;
            justify-content: space-between;
            border-bottom: 1px solid #334155;
        }

        .navbar a {
            color: #e5e7eb;
            text-decoration: none;
            margin-left: 15px;
            font-weight: bold;
        }

        .container {
            padding: 25px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .stat {
            font-size: 32px;
            font-weight: bold;
        }

        .low {
            color: #22c55e;
        }

        .medium {
            color: #facc15;
        }

        .high {
            color: #ef4444;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e293b;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #334155;
            text-align: left;
            font-size: 14px;
        }

        th {
            color: #93c5fd;
        }

        input, button {
            padding: 12px;
            margin: 8px 0;
            width: 100%;
            border-radius: 6px;
            border: none;
        }

        button {
            background: #2563eb;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #f87171;
            margin-bottom: 10px;
        }

        .success {
            color: #22c55e;
        }

        .badge {
            padding: 5px 9px;
            border-radius: 6px;
            font-weight: bold;
        }

        .badge-success {
            background: #14532d;
            color: #86efac;
        }

        .badge-failed {
            background: #7f1d1d;
            color: #fecaca;
        }

        .badge-low {
            background: #14532d;
            color: #86efac;
        }

        .badge-medium {
            background: #713f12;
            color: #fde68a;
        }

        .badge-high {
            background: #7f1d1d;
            color: #fecaca;
        }
    </style>
</head>
<body>

<div class="navbar">
    <div>
        <strong>ThreatPulse SOC Dashboard</strong>
    </div>
    <div>
        <a href="/dashboard">Dashboard</a>
        <a href="/events">Events</a>
        <a href="/alerts">Alerts</a>
        <a href="/export/events.csv">Export CSV</a>
        <a href="/logout">Logout</a>
    </div>
</div>

<div class="container">
    {% block content %}{% endblock %}
</div>

</body>
</html>
